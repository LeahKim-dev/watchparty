<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">2026 LoL KeSPA Cup</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

</head>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: rgba(255,255,255,0.08);
    --text: #f0f0f0;
    --muted: #888899;
    --accent: #3a7aff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }

  .top-bar {
    width: 100%;
    max-width: 1060px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2rem;
  }
  .event-pill {
    font-size: 24px;
    letter-spacing: 0.08em;
    color: var(--muted);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 8px 22px;
  }
  .real-clock {
    font-size: 26px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }
  #realtime { color: var(--text); font-weight: 500; }

  .conn-dot {
    display: inline-block;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #ff4d4d;
    margin-right: 8px;
    transition: background 0.3s;
  }
  .conn-dot.live { background: #d2d2d2; }

  .main-card {
    width: 100%;
    max-width: 1060px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 28px;
    overflow: hidden;
  }

  .match-header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 4rem 3.5rem;
    gap: 2.5rem;
    border-bottom: 1px solid var(--border);
  }

  .team { display: flex; flex-direction: column; align-items: center; gap: 18px; }

  .team-badge {
    width: 120px; height: 120px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .team-badge img { width: 100%; height: 100%; object-fit: contain; }
  .team-badge.has-bg img { object-fit: contain; padding: 8px; }

  .team-name { font-size: 38px; font-weight: 700; }
  .team-region { font-size: 16px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

  .score-center { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .series-score { display: flex; align-items: center; gap: 18px; }
  .series-num {
    font-size: 100px; font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
    transition: transform 0.15s ease;
  }
  .series-num.pop { animation: none; }
  .series-sep { font-size: 64px; color: var(--muted); font-weight: 300; }
  .series-format { font-size: 30px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .live-badge {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; color: #ff4d4d;
    letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600;
  }
  .live-dot { width: 9px; height: 9px; border-radius: 50%; background: #ff4d4d; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  .timer-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    border-bottom: 1px solid var(--border);
    background: var(--border);
  }
  .timer-box { background: var(--surface); padding: 2rem 3.5rem; display: flex; flex-direction: column; gap: 14px; }
  .box-label { font-size: 22px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .game-time-display { font-size: 82px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; color: var(--accent); line-height: 1; }
  .game-num-display { font-size: 82px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .game-num-sub { font-size: 24px; color: var(--muted); }
  .game-num-display .set-text { font-size: 0.65em; margin-left: 2px; font-weight: 500; }

  .timer-btns { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .btn-timer {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; color: var(--text);
    font-size: 18px; padding: 12px 24px;
    cursor: pointer; transition: background 0.15s;
    font-weight: 500;
  }
  .btn-timer:hover { background: rgba(255,255,255,0.12); }
  .btn-timer.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-timer.primary:hover { background: #2a6aef; }
  .btn-timer:active { transform: scale(0.96); }

  .time-adjust { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .time-input {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    color: var(--text);
    font-size: 22px;
    font-variant-numeric: tabular-nums;
    padding: 8px 14px;
    width: 88px; text-align: center; outline: none;
  }
  .time-input:focus { border-color: var(--accent); }
  .time-sep { color: var(--muted); font-size: 24px; }
  .btn-set-time {
    background: rgba(58,122,255,0.18);
    border: 1px solid rgba(58,122,255,0.35);
    border-radius: 10px;
    color: var(--accent);
    font-size: 18px; padding: 8px 20px;
    cursor: pointer; transition: background 0.15s;
    font-weight: 500;
  }
  .btn-set-time:hover { background: rgba(58,122,255,0.3); }

  .footer { padding: 1.5rem 3.5rem; display: flex; align-items: center; justify-content: space-between; }
  .footer-note { font-size: 22px; color: var(--muted); font-weight: 500; }

  .winner-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.4);
    z-index: 1000;
    align-items: center; justify-content: center;
  }
  .winner-overlay.show { display: flex; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .winner-container {
    position: relative;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    animation: zoomInCustom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) ease;
  }
  @keyframes zoomInCustom { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  #winner-custom-img {
    width: 100%; max-width: 1400px; height: 80vh;
    object-fit: contain; border-radius: 4px;
    box-shadow: 0 0 200px rgba(235, 16, 46, 0.5);
    display: block;
  }

  .winner-text-big {
    position: static; text-align: center;
    font-size: 64px; font-weight: 900; color: #ffffff;
    text-shadow: 0 4px 25px rgba(0,0,0,1), 0 0 40px rgba(0,0,0,1), 0 0 15px rgba(235,16,46,1);
    letter-spacing: -0.03em; padding: 0 40px; pointer-events: none; z-index: 10;
  }
  .winner-container.has-photo .winner-text-big { position: static; bottom: 50px; left: 0; width: 100%; }

  .event-wrapper { display: flex; align-items: center; gap: 10px; }
  .btn-bracket-top {
    margin: 0 !important; font-size: 24px; font-family: inherit;
    letter-spacing: 0 !important; text-transform: uppercase; color: var(--muted);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
    padding: 8px 6px !important; width: auto !important; cursor: pointer;
    transition: all 0.2s ease; background: none;
  }

  #bracket-overlay, #schedule-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.8); z-index: 10000;
    align-items: center; justify-content: center;
  }
  #bracket-overlay.show, #schedule-overlay.show { display: flex; animation: fadeIn 0.3s ease; }
</style>
<body>

<div class="winner-overlay" id="winner-overlay">
  <div class="winner-container">
    <img id="winner-custom-img" src="" alt="Winner Celebration">
    <div class="winner-text-big" id="winner-text-big"></div>
  </div>
</div>

<div class="top-bar">
  <div class="event-wrapper">
    <div class="event-pill"><span class="conn-dot" id="conn-dot"></span>2026 LoL KeSPA Cup</div>
    <button class="btn-timer btn-bracket-top" onclick="openScheduleModal()">📅</button>
  </div>
  <div class="real-clock">KST&nbsp;<span id="realtime">--:--:--</span></div>
</div>

<div id="schedule-overlay" onclick="closeScheduleModal()">
  <div class="winner-container">
    <img id="schedule-img" src="https://raw.githubusercontent.com/LeahKim-dev/watchparty/main/src/s_1.png" alt="일정표" style="max-width: 50vw; max-height: 90vh; border-radius: 16px;">
  </div>
</div>
<div id="bracket-overlay" onclick="closeBracketModal()">
  <div class="winner-container">
    <img id="bracket-img" src="https://raw.githubusercontent.com/LeahKim-dev/watchparty/main/src/bracket.png" alt="대진표" style="height: 90vh; border-radius: 16px;">
  </div>
</div>

<div class="main-card">
  <div class="match-header">
    <div class="team">
      <div class="team-badge" id="badge-left"></div>
      <div class="team-name" id="name-left">--</div>
      <div class="team-region" id="region-left">--</div>
    </div>

    <div class="score-center">
      <div class="series-score">
        <span class="series-num" id="set-left">0</span>
        <span class="series-sep">:</span>
        <span class="series-num" id="set-right">0</span>
      </div>
      <div class="series-format" id="series-format">0 : 0</div>
      <div class="live-badge"><span class="live-dot"></span> Live</div>
    </div>

    <div class="team">
      <div class="team-badge" id="badge-right"></div>
      <div class="team-name" id="name-right">--</div>
      <div class="team-region" id="region-right">--</div>
    </div>
  </div>

  <div class="timer-section">
    <div class="timer-box">
      <div class="box-label">게임 타이머</div>
      <div class="game-time-display" id="game-timer">00:00</div>
      <div class="timer-btns">
        <button class="btn-timer primary" id="ov-btn-start" onclick="ovStartTimer()">▶ 시작</button>
        <button class="btn-timer" onclick="ovPauseTimer()">⏸ 정지</button>
        <button class="btn-timer" onclick="ovResetTimer()">↺ 초기화</button>
      </div>
      <div class="time-adjust">
        <input class="time-input" id="ov-input-min" type="number" min="0" max="99" value="0">
        <span class="time-sep">:</span>
        <input class="time-input" id="ov-input-sec" type="number" min="0" max="59" value="0">
        <button class="btn-set-time" onclick="ovSetManualTime()">설정</button>
      </div>
    </div>
    <div class="timer-box">
      <div class="box-label">현재 게임</div>
      <div class="game-num-display" id="game-num">1<span class="set-text">세트</span></div>
      <div class="game-num-sub">Game <span id="game-num-sub">1</span> of <span id="best-of-sub">1</span></div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-note" id="winner-text"></div>
  </div>
</div>

<script>
  // ==========================================
  // 이 경기의 팀 매칭 + Firebase matchId — 경기마다 바꿔서 git push
  // ==========================================
  // teamLeft/teamRight는 더 이상 여기서 고정하지 않고 control.html에서 실시간으로 지정합니다.
  let teamLeft = null;
  let teamRight = null;
  const matchId = 'live'; // 고정 채널 하나만 계속 재사용 — control.html에서도 동일하게 'live'로 연결

  // Firebase 설정 — firebase-setup-guide.md 4번에서 받은 값으로 교체하세요
  const firebaseConfig = {
    apiKey: "AIzaSyC7TjpxZsNSutdKzcggoOAP-cZ2ygDjwiQ",
    authDomain: "watch-party-21a6e.firebaseapp.com",
    databaseURL: "https://watch-party-21a6e-default-rtdb.firebaseio.com",
    projectId: "watch-party-21a6e",
    storageBucket: "watch-party-21a6e.firebasestorage.app",
    messagingSenderId: "416861431344",
    appId: "1:416861431344:web:cbd747b34359c9077e2ff5"
  };

  const dbTeams = {
      t1: { name: "T1", region: "LCK · Korea", logoUrl: "https://raw.githubusercontent.com/LeahKim-dev/watchparty/main/src/teamlogo/t1_logo.svg", hasBg: true, color: "#aa0025", bgStyle: "#111111", shadow: "rgba(200,16,46,0.4)", confetti: ['#aa0025','#ff6b6b','#ffffff'] },
      geng: { name: "Gen.G", region: "LCK · Korea", logoUrl: "https://raw.githubusercontent.com/LeahKim-dev/watchparty/main/src/teamlogo/geng_logo.png", hasBg: true, color: "#a48528", bgStyle: "#fdfbfb", shadow: "rgba(164, 133, 40,0.4)", confetti: ['#a48528','#000000','#ffffff'] },
      kt: { name: "KT", region: "LCK · Korea", logoUrl: "https://raw.githubusercontent.com/LeahKim-dev/watchparty/main/src/teamlogo/kt_logo.webp", hasBg: true, color: "#fc0014", bgStyle: "#fdfbfb", shadow: "rgba(245, 135, 147, 0.4)", confetti: ['#ff8a94','#fc0014','#ffffff'] },
      dk: { name: "DK", region: "LCK · Korea", logoUrl: "https://raw.githubusercontent.com/LeahKim-dev/watchparty/main/src/teamlogo/dk_logo.png", hasBg: true, color: "#9efdf6", bgStyle: "#fdfbfb", shadow: "rgba(158, 253, 246,0.4)", confetti: ['#54d6ce','#9efdf6','#ffffff'] },
      bro: { name: "BRO", region: "LCK · Korea", logoUrl: "https://raw.githubusercontent.com/LeahKim-dev/watchparty/main/src/teamlogo/brion_logo.png", hasBg: true, color: "#04492c", bgStyle: "#fdfbfb", shadow: "rgba(0,74,47,0.4)", confetti: ['#04492cbb','#6bd3a8','#ffffff'] },
      ns: { name: "NS", region: "LCK · Korea", logoUrl: "https://raw.githubusercontent.com/LeahKim-dev/watchparty/main/src/teamlogo/ns_logo.svg", hasBg: true, color: "#e90029", bgStyle: "#fdfbfb", shadow: "rgba(253, 94, 99, 0.4)", confetti: ['#ff849a','#ffffff','#e90029'] },
      bfx: { name: "BFX", region: "LCK · Korea", logoUrl: "https://raw.githubusercontent.com/LeahKim-dev/watchparty/main/src/teamlogo/bfx_logo.svg", hasBg: true, color: "#fdcf22", bgStyle: "#fdfbfb", shadow: "rgba(253, 207, 34, 0.4)", confetti: ['#fdcf22','#ffea9f','#ffffff'] },
      krx: { name: "KRX", region: "LCK · Korea", logoUrl: "https://raw.githubusercontent.com/LeahKim-dev/watchparty/main/src/teamlogo/krx_logo.svg", hasBg: true, color: "#202e5c", bgStyle: "#fdfbfb", shadow: "rgba(94,148,212,0.4)", confetti: ['#4d60a1','#ffffff','#7389d1','#e2007f'] },
      hle: { name: "HLE", region: "LCK · Korea", logoUrl: "https://raw.githubusercontent.com/LeahKim-dev/watchparty/main/src/teamlogo/hle_logo.svg", hasBg: true, color: "#f06f25", bgStyle: "#fdfbfb", shadow: "rgba(255,69,0,0.4)", confetti: ['#ff9a60', '#ffecac', '#ffffff'] },
      dns: { name: "DNS", region: "LCK · Korea", logoUrl: "https://raw.githubusercontent.com/LeahKim-dev/watchparty/main/src/teamlogo/dns_logo.png", hasBg: true, color: "#2457ef", bgStyle: "#fdfbfb", shadow: "rgba(36, 87, 239,0.4)", confetti: ['#dbe4ff', '#85a3ff', '#ffffff'] },
    };
    
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let scoreLeft = 0, scoreRight = 0;
  let serverTimeOffset = 0;
  let currentState = { timerBaseSec: 0, timerRunning: false, timerStartedAtServer: null };
  let displayInterval = null;

  function initLayout() {
    if (!teamLeft || !teamRight) return; // 아직 컨트롤 패널에서 팀이 지정되지 않음 — 대기
    const leftData = dbTeams[teamLeft];
    const rightData = dbTeams[teamRight];
    if(!leftData || !rightData) return console.warn("알 수 없는 팀 코드:", teamLeft, teamRight);

    document.getElementById('page-title').textContent = `${leftData.name} vs ${rightData.name} — 26 KeSPA Cup`;

    document.getElementById('name-left').textContent = leftData.name;
    document.getElementById('region-left').textContent = leftData.region;
    const bLeft = document.getElementById('badge-left');
    bLeft.style.background = leftData.bgStyle;
    bLeft.style.border = `4px solid ${leftData.color}`;
    bLeft.style.boxShadow = `0 0 50px ${leftData.shadow}`;
    bLeft.innerHTML = `<img src="${leftData.logoUrl}" alt="${leftData.name}">`;
    if(leftData.hasBg) bLeft.classList.add('has-bg');

    document.getElementById('name-right').textContent = rightData.name;
    document.getElementById('region-right').textContent = rightData.region;
    const bRight = document.getElementById('badge-right');
    bRight.style.background = rightData.bgStyle;
    bRight.style.border = `4px solid ${rightData.color}`;
    bRight.style.boxShadow = `0 0 50px ${rightData.shadow}`;
    bRight.innerHTML = `<img src="${rightData.logoUrl}" alt="${rightData.name}">`;
    if(rightData.hasBg) bRight.classList.add('has-bg');
  }

  function pad(n) { return String(n).padStart(2,'0'); }

  function tick() {
    const now = new Date();
    document.getElementById('realtime').textContent = pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
  }
  tick(); setInterval(tick, 1000);

  // ---------- Firebase 연결 상태 ----------
  db.ref('.info/connected').on('value', snap => {
    document.getElementById('conn-dot').classList.toggle('live', snap.val() === true);
  });

  db.ref('.info/serverTimeOffset').on('value', snap => {
    serverTimeOffset = snap.val() || 0;
  });
  function getServerNow() { return Date.now() + serverTimeOffset; }

  // ---------- 실시간 상태 구독 (읽기 전용) ----------
  db.ref('matches/' + matchId).on('value', snapshot => {
    const data = snapshot.val();
    if (!data) return;
    currentState = data;
    updateOvStartButtonLabel();

    // 팀 매칭이 바뀌었을 때만 배지/이름을 다시 그림 (매번 새로 그리면 깜빡임 발생)
    if (data.teamLeft && data.teamRight && (data.teamLeft !== teamLeft || data.teamRight !== teamRight)) {
      teamLeft = data.teamLeft;
      teamRight = data.teamRight;
      initLayout();
    }

    const newLeft = data.scoreLeft || 0;
    const newRight = data.scoreRight || 0;
    if (newLeft !== scoreLeft) popScore('set-left');
    if (newRight !== scoreRight) popScore('set-right');
    scoreLeft = newLeft;
    scoreRight = newRight;
    document.getElementById('set-left').textContent = scoreLeft;
    document.getElementById('set-right').textContent = scoreRight;

    const gameNum = data.gameNum || 1; // gameNum은 control에서 점수와 무관하게 수동 조정되는 값 — 점수로 역산하지 않음
    document.getElementById('game-num').innerHTML = gameNum + '<span class="set-text">세트</span>';
    document.getElementById('game-num-sub').textContent = gameNum;

    const bestOf = data.bestOf || 1;
    const setL = data.setScoreLeft || 0;
    const setR = data.setScoreRight || 0;
    document.getElementById('best-of-sub').textContent = bestOf;
    document.getElementById('series-format').textContent = setL + ' : ' + setR;

    checkWinner(data.winner);
    startDisplayLoop();
  });

  function computeCurrentTimerSec() {
    if (currentState.timerRunning && currentState.timerStartedAtServer) {
      const elapsed = Math.floor((getServerNow() - currentState.timerStartedAtServer) / 1000);
      return (currentState.timerBaseSec || 0) + Math.max(0, elapsed);
    }
    return currentState.timerBaseSec || 0;
  }

  function startDisplayLoop() {
    if (displayInterval) clearInterval(displayInterval);
    displayInterval = setInterval(() => {
      const sec = computeCurrentTimerSec();
      document.getElementById('game-timer').textContent = pad(Math.floor(sec/60))+':'+pad(sec%60);
    }, 500);
  }

  function popScore(id) {
    const el = document.getElementById(id);
    el.classList.remove('pop');
    void el.offsetWidth;
    el.classList.add('pop');
  }

  // 승자 판정은 control.html에서만 수행하고, 여기서는 넘어온 data.winner('left'|'right'|null)를
  // 그대로 표시만 한다. scoreLeft/scoreRight를 직접 비교하는 로직은 두지 않는다.
  let lastShownWinner = null; // 같은 winner 상태로 스냅샷이 여러 번 와도 승리 연출을 반복 재생하지 않기 위함

  function checkWinner(winner) {
    const el = document.getElementById('winner-text');

    if (winner === 'left' && dbTeams[teamLeft]) {
      el.textContent = `🏆 ${dbTeams[teamLeft].name} 승리!`;
      if (lastShownWinner !== 'left') {
        showWinner(dbTeams[teamLeft].name, dbTeams[teamLeft].confetti, dbTeams[teamLeft].winnerImgUrl);
      }
    } else if (winner === 'right' && dbTeams[teamRight]) {
      el.textContent = `🏆 ${dbTeams[teamRight].name} 승리!`;
      if (lastShownWinner !== 'right') {
        showWinner(dbTeams[teamRight].name, dbTeams[teamRight].confetti, dbTeams[teamRight].winnerImgUrl);
      }
    } else {
      el.textContent = '';
    }
    lastShownWinner = winner || null;
  }

  function showWinner(name, colors, winnerCustomImg) {
    const overlay = document.getElementById('winner-overlay');
    const txt = document.getElementById('winner-text-big');
    const img = document.getElementById('winner-custom-img');

    if (img) {
      if (winnerCustomImg) {
        txt.style.opacity = "0";
        img.onload = () => { txt.style.opacity = "1"; };
        img.src = winnerCustomImg;
        img.style.display = 'block';
        img.closest('.winner-container').classList.add('has-photo');
      } else {
        img.style.display = 'none';
        img.closest('.winner-container').classList.remove('has-photo');
      }
    }

    if (txt) {
      const shadowColor = (Array.isArray(colors) && colors.length > 0) ? colors[0] : colors;
      txt.style.textShadow = `0 4px 25px rgba(0,0,0,1), 0 0 40px rgba(0,0,0,1), 0 0 15px ${shadowColor}`;
      txt.textContent = '🏆 ' + name + ' WIN!';
      if (overlay) overlay.classList.add('show');

      const end = Date.now() + 4000;
      (function frame() {
        confetti({ particleCount: 6, angle: 60, spread: 55, origin:{x:0}, colors, zIndex: 99999 });
        confetti({ particleCount: 6, angle: 120, spread: 55, origin:{x:1}, colors, zIndex: 99999 });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
      setTimeout(()=>{ overlay.classList.remove('show'); }, 4500);
    }
  }

  function openBracketModal() { document.getElementById('bracket-overlay')?.classList.add('show'); }
  function closeBracketModal() { document.getElementById('bracket-overlay')?.classList.remove('show'); }
  function openScheduleModal() { document.getElementById('schedule-overlay')?.classList.add('show'); }
  function closeScheduleModal() { document.getElementById('schedule-overlay')?.classList.remove('show'); }

  // ---------- 타이머 조작 (로그인 없이 오버레이에서 바로 가능) ----------
  // Security Rules가 write: true (공개 쓰기)로 설정돼 있어야 동작합니다.
  const matchRef = db.ref('matches/' + matchId);

  function ovStartTimer() {
    if (currentState.timerRunning) return;
    matchRef.update({
      timerRunning: true,
      timerStartedAtServer: getServerNow()
    });
  }

  function ovPauseTimer() {
    if (!currentState.timerRunning) return;
    matchRef.update({
      timerBaseSec: computeCurrentTimerSec(),
      timerRunning: false,
      timerStartedAtServer: null
    });
  }

  function ovResetTimer() {
    matchRef.update({
      timerBaseSec: 0,
      timerRunning: false,
      timerStartedAtServer: null
    });
    document.getElementById('ov-input-min').value = 0;
    document.getElementById('ov-input-sec').value = 0;
  }

  function ovSetManualTime() {
    const m = parseInt(document.getElementById('ov-input-min').value) || 0;
    const s = parseInt(document.getElementById('ov-input-sec').value) || 0;
    const wasRunning = currentState.timerRunning;
    matchRef.update({
      timerBaseSec: m*60 + Math.min(s,59),
      timerRunning: false,
      timerStartedAtServer: null
    }).then(() => {
      if (wasRunning) ovStartTimer();
    });
  }

  // 타이머 진행 상태에 맞춰 "시작" 버튼 라벨 갱신
  function updateOvStartButtonLabel() {
    const btn = document.getElementById('ov-btn-start');
    if (!btn) return;
    btn.textContent = currentState.timerRunning ? '▶ 진행 중' : '▶ 시작';
  }
</script>
</body>
</html>
